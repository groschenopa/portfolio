# Eigener Pages-Deploy für die statische Seite (kein Build-Schritt).
# Ersetzt die von GitHub verwaltete Branch-Pipeline, deren Deploy-Step
# im Pages-Backend hängen blieb (Juli 2026: "Deployment failed, try again later").
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Stellt die Pages-Source automatisch auf "GitHub Actions" um
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Ganze Repo-Wurzel veröffentlichen (.git/.github werden ausgeschlossen)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
